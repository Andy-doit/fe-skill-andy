<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="100%" height="270" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Connector Arrow Gradients -->
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Card Glow Highlights -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== CARD 1: 4-LAYER & TWIN ==================== -->
  <g transform="translate(20, 10)">
    <!-- Base Card -->
    <rect width="800" height="64" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" />
    <!-- Left Neon Accent Stripe -->
    <rect width="4" height="64" rx="2" fill="#38bdf8" />
    <!-- Card Header / Step -->
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#38bdf8">
      1. KIẾN TRÚC 4 TẦNG &amp; CONNECTED / PURE TWIN PATTERN
    </text>
    <!-- Card Content Flow -->
    <text x="24" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Tokens <tspan fill="#38bdf8">──►</tspan> Primitives (Ramp md) <tspan fill="#38bdf8">──►</tspan> Blocks (Pure Base + Connected) <tspan fill="#38bdf8">──►</tspan> Features (Pages)
    </text>
  </g>

  <!-- Connector Arrow 1 -->
  <g>
    <path d="M 420 74 L 420 95" stroke="url(#arrowGrad1)" stroke-width="2" stroke-linecap="round" />
    <path d="M 416 91 L 420 97 L 424 91" stroke="url(#arrowGrad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== CARD 2: DATASLOT & SKELETON PARITY ==================== -->
  <g transform="translate(20, 103)">
    <!-- Base Card -->
    <rect width="800" height="64" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" />
    <!-- Left Neon Accent Stripe -->
    <rect width="4" height="64" rx="2" fill="#818cf8" />
    <!-- Card Header / Step -->
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#818cf8">
      2. DATASLOT&lt;T&gt; &amp; SKELETON PARITY (ZERO LAYOUT SHIFT)
    </text>
    <!-- Card Content Flow -->
    <text x="24" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Loading <tspan fill="#818cf8">──►</tspan> Error / 403 <tspan fill="#818cf8">──►</tspan> Empty <tspan fill="#818cf8">──►</tspan> Ready <tspan fill="#94a3b8" font-size="11.5">(Cùng 1 cây DOM qua SlotView, CLS = 0 tuyệt đối)</tspan>
    </text>
  </g>

  <!-- Connector Arrow 2 -->
  <g>
    <path d="M 420 167 L 420 188" stroke="url(#arrowGrad2)" stroke-width="2" stroke-linecap="round" />
    <path d="M 416 184 L 420 190 L 424 184" stroke="url(#arrowGrad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== CARD 3: ZERO-LOOSENING GATE ==================== -->
  <g transform="translate(20, 196)">
    <!-- Base Card -->
    <rect width="800" height="64" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" />
    <!-- Left Neon Accent Stripe -->
    <rect width="4" height="64" rx="2" fill="#10b981" />
    <!-- Card Header / Step -->
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#10b981">
      3. CỔNG CHẶN NỚI LỎNG (ZERO-LOOSENING QUALITY GATE)
    </text>
    <!-- Card Content Flow -->
    <text x="24" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      check-loosening.mjs <tspan fill="#10b981">──►</tspan> Chặn sạch @ts-ignore · eslint-disable · it.skip · || true <tspan fill="#94a3b8" font-size="11.5">(Máy chấm độc lập)</tspan>
    </text>
  </g>
</svg>
