<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="840" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#27272a" />
    </pattern>
  </defs>

  <!-- Border & Base Surface -->
  <rect width="840" height="180" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
  <rect width="840" height="180" rx="12" fill="url(#dotPattern)" opacity="0.6" />

  <!-- Top Accent Neon Hairline -->
  <path d="M 120 0 L 720 0" stroke="url(#accentLine)" stroke-width="2" />

  <!-- Pill Badge: Architecture Harness -->
  <g transform="translate(325, 22)">
    <rect width="190" height="22" rx="11" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="95" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#38bdf8">
      FRONTEND AGENT HARNESS
    </text>
  </g>

  <!-- Main Hero Brand Typography -->
  <text x="50%" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="12" fill="url(#textGrad)">
    ANDY
  </text>

  <!-- Subtitle: High-Contrast Developer Positioning -->
  <text x="50%" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#a1a1aa">
    SENIOR ARCHITECT · 4-LAYER LAW · ZERO-LOOSENING
  </text>
</svg>
