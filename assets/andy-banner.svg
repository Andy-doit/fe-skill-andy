<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="andyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="840" height="220" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid -->
  <rect width="840" height="220" rx="16" fill="url(#gridPattern)" />

  <!-- Radial Glow Behind Brand Name -->
  <ellipse cx="420" cy="115" rx="260" ry="85" fill="url(#centerGlow)" />

  <!-- Top Badge / Pill -->
  <g transform="translate(295, 22)">
    <rect width="250" height="26" rx="13" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text x="125" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#38bdf8">
      ⚡ AUTONOMOUS AGENT HARNESS
    </text>
  </g>

  <!-- Main Hero Brand Name: ANDY -->
  <text x="50%" y="126" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="74" font-weight="900" letter-spacing="8" fill="url(#andyGrad)">
    ANDY
  </text>

  <!-- Subtitle: Position & Title -->
  <text x="50%" y="162" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" letter-spacing="2.5" fill="#e2e8f0">
    FRONTEND ARCHITECT &amp; QUALITY HARNESS
  </text>

  <!-- Bottom Tech Specs Line -->
  <text x="50%" y="193" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#64748b">
    ZERO LOOSENING · 4-LAYER ARCHITECTURE · 21 SKILLS · PROOF LENSES · WCAG 2.2 AA
  </text>
</svg>
